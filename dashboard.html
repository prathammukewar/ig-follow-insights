<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Follow Insights</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img src="icons/icon32.png" alt=""><span>Follow Insights</span></div>
      <div id="accountBox" class="account-box"></div>
      <div class="side-search"><input id="globalSearch" placeholder="Find anyone  (press /)" autocomplete="off" spellcheck="false"></div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div id="scanBox" class="scan-box"></div>
      </div>
    </aside>
    <div class="main-col">
      <div id="scanBanner"></div>
      <main id="main" class="main"><div class="skeleton">Loading your data<div class="bar"></div><div class="bar" style="max-width:300px"></div></div></main>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
